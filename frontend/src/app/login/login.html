<section class="page page-narrow">
    <div class="panel">
        <h1 class="form-title">Log in</h1>
        <p class="form-intro">Use the email you signed up with</p>

        <form (ngSubmit)="submit()">
            <div class="field">
                <label for="email">Email<span class="required" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required [(ngModel)]="email">
            </div>

            <div class="field">
                <label for="password">Password<span class="required" aria-hidden="true">*</span></label>
                <input type="password" id="password" name="password" autocomplete="current-password" required [(ngModel)]="password">
            </div>

            @if(error()) {
                <p class="form-error" role="alert">{{ error() }}</p>
            }

            <button type="submit" class="button button-primary button-large button-block" [disabled]="isSending()">
                {{ isSending() ? "Logging in" : "Log in" }}
            </button>
        </form>
    </div>
    <p class="form-switch">New to Workwise? <a routerLink="/signup">Create an account</a></p>
</section>
