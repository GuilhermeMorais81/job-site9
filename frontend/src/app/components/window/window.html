<div class="row m-5">
  @if(isLoading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading jobs...</span>
      </div>
    </div>
  }
  @else {
    @for(job of jobs(); track job.id) {
      <div class="col-md-8 col-8 mb-3">
        <div class="card shadow-sm" style="max-width: 22rem;">
          <div class="card-body d-flex flex-column">
              <h5 class="card-title mb-1">{{ job.title }}</h5>
              <h6 class="card-subtitle mb-3 text-muted">{{job.company}}</h6>
              <div class="d-flex justify-content-between align-items-center mt-auto">
                  <small class="text-secondary">Posted in {{job.createdAt | date:"shortDate"}}</small>
                  <a [routerLink]="['/jobs', job.id]" class="btn btn-outline-primary btn-sm">View Details</a>
              </div>
          </div>
        </div>
      </div>
    }
    @empty {
      <p class="text-muted">No jobs available.</p>
    }
  }
  
</div>
