<a href="#content" class="skip-link" (click)="skipToContent($event)">Skip to content</a>

<aside aria-label="Accessibility tools">
    <app-read-aloud />
</aside>

<header class="site-header">
    <div class="site-header-inner">
        <a routerLink="/" class="brand">
            <img src="logo-workwise.png" id="logotipo" alt="" aria-hidden="true">
            <span id="siteName" class="visually-hidden">Workwise</span>
        </a>

        <form class="search" id="menu" role="search" (ngSubmit)="searchJob()">
            <button type="submit" aria-label="Search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            </button>
            <input type="search" id="termSearch" name="termSearch" placeholder="Search jobs by title" aria-label="Search jobs by title" [(ngModel)]="termSearch">
        </form>

        <nav class="auth-links" aria-label="Account">
            <a routerLink="/login" class="text-link">Log in</a>
            <a routerLink="/signup" class="button button-primary">Sign up</a>
        </nav>
    </div>
</header>

<main id="content" tabindex="-1">
    <router-outlet></router-outlet>
</main>

<footer class="site-footer">
    <div class="site-footer-inner">© Workwise</div>
</footer>
