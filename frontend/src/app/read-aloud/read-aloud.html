@if(isSupported) {
  <button type="button" class="read-aloud-toggle" [class.on]="isOn()" [attr.aria-pressed]="isOn()" (click)="toggle()">
    <svg class="speaker" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4z"/>
      <path class="wave wave-1" pathLength="1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path class="wave wave-2" pathLength="1" d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
    <span>Read aloud</span>
    <span class="state" aria-hidden="true">
      <span class="state-off">Off</span>
      <span class="state-on">On</span>
    </span>
  </button>
}
